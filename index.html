<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- "Adicionar à Tela de Início" no iPhone abre em tela cheia, sem as barras do Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Galego">
  <title>A Fuga do Galego</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #2a1f4a;
      overflow: hidden;
      touch-action: none;       /* evita zoom/scroll no celular ao tocar */
      user-select: none;
    }
    /* O jogo tem 960x540 "de desenho"; o CSS só ajusta à janela (veja ajustarTela) */
    #palco {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 960px;
      height: 540px;
      transform-origin: center;
    }
    #jogo { display: block; }
    #som {
      position: absolute;
      right: 18px;
      bottom: 22px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 4px solid #2a1f4a;
      background: #fff6dc;
      box-shadow: 0 5px 0 #2a1f4a;
      font-size: 28px;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      touch-action: manipulation;
    }
    #som:active { transform: translateY(4px); box-shadow: 0 1px 0 #2a1f4a; }
  </style>
</head>
<body>
<div id="palco"><canvas id="jogo"></canvas><button id="som" type="button" tabindex="-1"></button></div>
<!-- Kaboom.js via CDN (versão fixa para não quebrar no futuro) -->
<script src="https://unpkg.com/kaboom@3000.1.17/dist/kaboom.js"></script>
<script>
// =====================================================================
//  A FUGA DO GALEGO  —  Endless Runner 2D em Kaboom.js (visual cartoon)
// =====================================================================

// Alta definição: o canvas tem os pixels reais da tela (janela grande, celular "retina"),
// em vez de desenhar em 960x540 e esticar, o que deixava tudo serrilhado.
const CANVAS = document.getElementById("jogo");
// Celular em pé: o jogo é girado 90° e ocupa a tela deitada (o iPhone não deixa
// travar a orientação pelo site). Como todo toque vale como "pular"/"jogar",
// girar não atrapalha os controles.
const emPe = () => window.innerHeight > window.innerWidth;
const escalaPara = (largura, altura) => Math.min(largura / 960, altura / 540);
const escalaDaJanela = () => emPe()
  ? escalaPara(window.innerHeight, window.innerWidth)
  : escalaPara(window.innerWidth, window.innerHeight);
// a nitidez é fixada ao abrir: usa a maior escala entre as duas orientações,
// para continuar nítido quando o celular for virado
const NITIDEZ = Math.min(3, Math.max(1, (window.devicePixelRatio || 1) * Math.max(
  escalaPara(window.innerWidth, window.innerHeight),
  escalaPara(window.innerHeight, window.innerWidth))));
function ajustarTela() {
  const girar = emPe() ? " rotate(90deg)" : "";
  document.getElementById("palco").style.transform =
    `translate(-50%, -50%)${girar} scale(${escalaDaJanela()})`;
}
ajustarTela();
window.addEventListener("resize", ajustarTela);
window.addEventListener("orientationchange", () => setTimeout(ajustarTela, 300));

kaboom({
  canvas: CANVAS,
  width: 960,
  height: 540,
  pixelDensity: NITIDEZ,
  crisp: false,
  background: [42, 31, 74],
});

// ---------------------------------------------------------------------
//  ESTILO CARTOON: contorno escuro grosso, cores fortes, fonte gordinha
// ---------------------------------------------------------------------
const TINTA = rgb(40, 25, 60);   // cor de todos os contornos
const COR = {
  ceuTopo: rgb(70, 170, 255), ceuBase: rgb(190, 235, 255),
  morroLonge: rgb(140, 215, 110), morroPerto: rgb(85, 185, 75),
  asfalto: rgb(75, 72, 95), creme: rgb(255, 248, 225),
  verde: rgb(70, 190, 80), vermelho: rgb(235, 60, 60), azul: rgb(60, 120, 230),
  laranja: rgb(255, 150, 30), amarelo: rgb(255, 210, 40),
};
// Fonte local (pasta fonts/). "contorno" já vem com borda escura; "texto" é lisa.
// Fonte gerada grande (160) para continuar nítida na tela cheia; a borda acompanha a proporção.
loadFont("contorno", "fonts/LilitaOne-Regular.ttf", { outline: { width: 13, color: TINTA }, size: 160 });
loadFont("texto", "fonts/LilitaOne-Regular.ttf", { size: 160 });

// ---------------------------------------------------------------------
//  IMAGENS  ➜  É AQUI QUE VOCÊ COLOCA AS FOTOS!
//  - Deixe url: "" para usar o desenho cartoon do próprio jogo.
//  - Use PNG com fundo transparente (foto recortada) para ficar bonito.
//  - Caminho relativo à pasta deste arquivo, ex: "img/galego.png"
// ---------------------------------------------------------------------
const IMAGENS = {
  piloto:    { url: "img/galego-moto.png" }, // o Galego inteiro na moto (caricatura com fundo removido)
  galego:    { url: "img/galego.png" }, // rosto recortado em oval: aparece tonto no game over
  moto:      { url: "" /* (OPCIONAL) imagem da moto/kart, ex: "img/moto.png" */ },
  coca:      { url: "img/coca.png" }, // garrafa de 1 litro (fundo transparente)
  remedio:   { url: "" /* (OPCIONAL) imagem da caixa de remédio, ex: "img/remedio.png" */ },
  halter:    { url: "" /* (OPCIONAL) imagem do halter, ex: "img/halter.png" */ },
  herculano: { url: "img/herculano.png" },
  carro_som: { url: "" /* (OPCIONAL) imagem do carro de som, ex: "img/carro_som.png" */ },
};

// Só carrega o sprite se tiver URL. Sem URL => desenho cartoon.
// Atenção: aberto com duplo clique (file://) o navegador BLOQUEIA imagens.
const ABERTO_DO_DISCO = location.protocol === "file:";
let IMAGEM_BLOQUEADA = false;
for (const [nome, img] of Object.entries(IMAGENS)) {
  if (!img.url) continue;
  if (ABERTO_DO_DISCO && !img.url.startsWith("data:")) {
    IMAGEM_BLOQUEADA = true;
    img.url = "";
    continue;
  }
  loadSprite(nome, img.url);
}

// ---------------------------------------------------------------------
//  AJUSTES DO JOGO (mexa à vontade)
// ---------------------------------------------------------------------
const GRAVIDADE    = 2400;
const FORCA_PULO   = 820;   // altura do pulo
const CORTE_PULO   = 0.45;  // soltar o botão cedo = pulo mais baixo
const VEL_INICIAL  = 360;   // pixels por segundo
const VEL_MAX      = 900;
const BOOST_COCA   = 12;    // velocidade extra por Coca
const CHAO_Y       = 460;   // altura do chão
const GALEGO_X     = 140;   // posição fixa do Galego na tela
const FOLGA_MAXIMA = 108;
const FOLGA_CAPTURA = 32;
const FOLGA_POR_COCA = 19;
const INTERVALO_ARRANCADA = 14;
const AVISO_ARRANCADA = 1;
const DURACAO_ARRANCADA = 0.24;
const P_W = 70, P_H = 95;   // tamanho do Galego + moto
// Desenho do Galego na moto: 120 x 169, rodas alinhadas ao chão, sobrando para os lados
const PILOTO = { w: 120, h: 169, x: -25, y: P_H - 169 };

const FRASES_COCA = [
  "GELAAADA!", "Mais uma!", "Remédio é o caramba!", "Glub glub!",
  "Isso que é vitamina!", "Só uma... a décima.", "+10",
];
const NASCIMENTO = new Date(1959, 6, 28); // 28/07/1959

function idadeDoGalego() {
  const hoje = new Date();
  let idade = hoje.getFullYear() - NASCIMENTO.getFullYear();
  const m = hoje.getMonth() - NASCIMENTO.getMonth();
  if (m < 0 || (m === 0 && hoje.getDate() < NASCIMENTO.getDate())) idade--;
  return idade;
}

function lerRecorde() {
  try { return Number(localStorage.getItem("galego_recorde")) || 0; } catch (e) { return 0; }
}
function salvarRecorde(v) {
  try { localStorage.setItem("galego_recorde", String(v)); } catch (e) { /* sem storage, tudo bem */ }
}

// ---------------------------------------------------------------------
//  Música de fundo: chiptune original gerado na hora (Web Audio), sem arquivos.
//  Só começa no primeiro toque/tecla (regra dos navegadores, principalmente o iPhone).
// ---------------------------------------------------------------------
const Musica = (() => {
  // Melodia em colchetes (8 por compasso): nota, "-" segura a anterior, "." pausa
  const MELODIA = [
    "E5 G5 . G5 A5 G5 E5 .",   "C5 . E5 . D5 C5 A4 .",
    "F5 . A5 . G5 F5 E5 D5",   "D5 . G5 . F5 E5 D5 .",
    "G5 . E5 G5 C6 . B5 A5",   "A5 . E5 . A5 G5 E5 .",
    "F5 G5 A5 . C6 . A5 F5",   "G5 . D5 . G4 - . .",
  ].map((c) => c.split(" "));
  const BAIXO = ["C3", "A2", "F2", "G2", "C3", "A2", "F2", "G2"]; // Dó, Lá m, Fá, Sol
  const NOTAS = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const freq = (n) => 440 * Math.pow(2, (NOTAS[n[0]] + 12 * (Number(n.slice(1)) + 1) - 69) / 12);

  let ctx = null, mestre = null, ruido = null, timer = null;
  let passo = 0, proximo = 0, bpm = 132;
  let mudo = false;
  try { mudo = localStorage.getItem("galego_mudo") === "1"; } catch (e) { /* sem storage */ }

  function tom(tipo, f, t, dur, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipo; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(mestre); o.start(t); o.stop(t + dur + 0.02);
  }
  function chiado(t, dur, vol, corte) {
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = ruido; f.type = "highpass"; f.frequency.value = corte;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(mestre); s.start(t); s.stop(t + dur + 0.02);
  }
  function bumbo(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g).connect(mestre); o.start(t); o.stop(t + 0.17);
  }

  // um passo = colcheia; 8 passos por compasso, 8 compassos no loop
  function tocarPasso(i, t) {
    const colcheia = 30 / bpm, compasso = Math.floor(i / 8) % 8, k = i % 8;
    const nota = MELODIA[compasso][k];
    if (nota !== "-" && nota !== ".") {
      let dur = colcheia * 0.9;
      for (let j = k + 1; j < 8 && MELODIA[compasso][j] === "-"; j++) dur += colcheia;
      tom("square", freq(nota), t, dur, 0.05);
    }
    const raiz = freq(BAIXO[compasso]);
    tom("triangle", k % 2 ? raiz * 2 : raiz, t, colcheia * 0.8, 0.16);
    if (k % 4 === 0) bumbo(t);
    if (k % 4 === 2) chiado(t, 0.12, 0.12, 1500);   // caixa
    chiado(t, 0.03, k % 2 ? 0.05 : 0.025, 7000);     // chimbal
  }

  const NOTAS_REFRAO = ["C5", "E5", "G5", "A5", "G5", "E5", "D5", "G5"];
  let inicioRefrao = null;

  function tocarRefrao(i, t) {
    const k = (i - inicioRefrao) % NOTAS_REFRAO.length;
    tom("square", freq(NOTAS_REFRAO[k]), t, 24 / bpm, 0.065);
    tom("triangle", freq(k < 4 ? "C3" : "G3"), t, 24 / bpm, 0.15);
    if (k % 2 === 0) bumbo(t);
    if (k % 2 === 1) chiado(t, 0.05, 0.10, 4000);
  }

  function agendar() {
    while (proximo < ctx.currentTime + 0.15) {
      if (inicioRefrao === null) tocarPasso(passo, proximo);
      else tocarRefrao(passo, proximo);
      passo++;
      proximo += 30 / bpm;
    }
  }

  function iniciar() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      mestre = ctx.createGain();
      mestre.gain.value = mudo ? 0 : 0.35;
      mestre.connect(ctx.destination);
      ruido = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      const d = ruido.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state !== "running") ctx.resume();
    if (!timer) { proximo = ctx.currentTime + 0.05; timer = setInterval(agendar, 25); }
  }

  function alternar() {
    mudo = !mudo;
    try { localStorage.setItem("galego_mudo", mudo ? "1" : "0"); } catch (e) { /* sem storage */ }
    if (mestre) mestre.gain.setTargetAtTime(mudo ? 0 : 0.35, ctx.currentTime, 0.05);
    return mudo;
  }

  // "Uó-uó-uó" de quando o Galego bate
  function tropeco() {
    if (!ctx) return;
    const t = ctx.currentTime + 0.02;
    ["G4", "F4", "E4", "D4"].forEach((n, i) => tom("square", freq(n), t + i * 0.16, i === 3 ? 0.5 : 0.15, 0.07));
  }

  // pausa quando a aba/app fica em segundo plano
  document.addEventListener("visibilitychange", () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else ctx.resume();
  });

  return {
    iniciar, alternar, tropeco,
    get mudo() { return mudo; },
    ritmo(novo) { bpm = novo; },
    iniciarRefrao() { inicioRefrao = passo; },
    encerrarRefrao() { inicioRefrao = null; },
  };
})();

// primeiro toque ou tecla liga a música (o iPhone só libera áudio num gesto do usuário)
for (const ev of ["pointerdown", "touchend", "keydown", "click"]) {
  document.addEventListener(ev, () => Musica.iniciar(), { passive: true });
}

// Botão de som (HTML por cima do jogo; gira junto com o palco)
const BOTAO_SOM = document.getElementById("som");
function mostrarSom() {
  BOTAO_SOM.textContent = Musica.mudo ? "🔇" : "🔊";
  BOTAO_SOM.setAttribute("aria-label", Musica.mudo ? "Ligar som" : "Desligar som");
}
BOTAO_SOM.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); });
BOTAO_SOM.addEventListener("click", (e) => { e.stopPropagation(); Musica.alternar(); mostrarSom(); });
window.addEventListener("keydown", (e) => { if (e.key === "m" || e.key === "M") { Musica.alternar(); mostrarSom(); } });
mostrarSom();

// Velocidade usada pelas rodas e pelo cenário da cena atual.
let VEL_ATUAL = 0;

// ---------------------------------------------------------------------
//  Peças de desenho
// ---------------------------------------------------------------------
function escrever(msg, tamanho, opts = {}) {
  return text(msg, {
    size: tamanho,
    font: opts.liso ? "texto" : "contorno",
    width: opts.largura,
    align: opts.alinhar || "center",
    // a borda da fonte "contorno" alarga cada letra; aproxima de volta
    letterSpacing: opts.liso ? 0 : -tamanho * 0.33,
  });
}

// Bloco arredondado com contorno (painéis, botões, etiquetas)
function bloco(pai, w, h, x, y, cor, opts = {}) {
  return (pai ? pai.add.bind(pai) : add)([
    rect(w, h, { radius: opts.raio ?? Math.min(w, h) / 2 }),
    pos(x, y),
    color(cor),
    outline(opts.borda ?? 4, TINTA),
    ...(opts.anchor ? [anchor(opts.anchor)] : []),
    z(opts.z ?? 0),
  ]);
}

// Botão "de brinquedo": sombra embaixo + corpo + texto, pulsando
function botao(rotulo, x, y, w, h, cor) {
  const b = add([pos(x, y), anchor("center"), scale(1), z(70)]);
  b.add([rect(w, h, { radius: h / 2 }), anchor("center"), pos(0, 7), color(TINTA)]);
  b.add([rect(w, h, { radius: h / 2 }), anchor("center"), color(cor), outline(5, TINTA)]);
  b.add([rect(w - 30, h * 0.28, { radius: h * 0.14 }), anchor("center"), pos(0, -h * 0.22), color(255, 255, 255), opacity(0.35)]);
  b.add([escrever(rotulo, h * 0.55), anchor("center"), pos(0, 2), color(255, 255, 255)]);
  b.onUpdate(() => { b.scale = vec2(1 + Math.sin(time() * 5) * 0.04); });
  return b;
}

// ---------- Objetos do jogo, desenhados em "w x h" a partir do canto ----------
function desenharCoca(o, w, h) {
  o.add([rect(w, h, { radius: 8 }), color(225, 30, 45), outline(3, TINTA)]);
  o.add([rect(w - 6, 5, { radius: 2 }), pos(3, 3), color(225, 225, 235)]);
  o.add([rect(w - 6, 5, { radius: 2 }), pos(3, h - 8), color(225, 225, 235)]);
  o.add([rect(w - 2, 12, { radius: 3 }), pos(1, h * 0.4), color(255, 255, 255)]);
  o.add([escrever("COCA", 9, { liso: true }), pos(w / 2, h * 0.4 + 7), anchor("center"), color(225, 30, 45)]);
  o.add([rect(4, h - 20, { radius: 2 }), pos(5, 10), color(255, 255, 255), opacity(0.45)]);
}

function caixaRemedio(o, w, h, y0) {
  o.add([rect(w, h, { radius: 6 }), pos(0, y0), color(255, 255, 255), outline(3, TINTA)]);
  o.add([rect(w - 8, 4, { radius: 2 }), pos(4, y0 + 5), color(210, 215, 230)]);
  o.add([rect(w - 8, 7, { radius: 3 }), pos(4, y0 + h - 11), color(COR.azul)]);
  const c = Math.min(w, h) * 0.5;
  o.add([rect(c * 0.36, c), pos(w / 2, y0 + h / 2 - 2), anchor("center"), color(COR.vermelho)]);
  o.add([rect(c, c * 0.36), pos(w / 2, y0 + h / 2 - 2), anchor("center"), color(COR.vermelho)]);
}
function desenharRemedio(o, w, h) {
  if (h > 60) { caixaRemedio(o, w, h / 2, 0); caixaRemedio(o, w, h / 2, h / 2); } // empilhado
  else caixaRemedio(o, w, h, 0);
}

function desenharHalter(o, w, h) {
  o.add([rect(w - 16, 9, { radius: 4 }), pos(8, h / 2 - 4.5), color(175, 180, 195), outline(3, TINTA)]);
  for (const [x, ww, hh] of [[2, 12, h], [w - 14, 12, h], [13, 9, h - 12], [w - 22, 9, h - 12]]) {
    o.add([rect(ww, hh, { radius: 4 }), pos(x, (h - hh) / 2), color(55, 55, 70), outline(3, TINTA)]);
    o.add([rect(3, hh - 10, { radius: 2 }), pos(x + 3, (h - hh) / 2 + 5), color(255, 255, 255), opacity(0.25)]);
  }
}

function nota(pai, x, y, s) {
  const n = pai.add([pos(x, y), { baseY: y, fase: rand(0, 6) }]);
  n.add([circle(5 * s), color(TINTA)]);
  n.add([rect(3 * s, 16 * s), pos(2 * s, -16 * s), color(TINTA)]);
  n.add([rect(8 * s, 3 * s), pos(2 * s, -16 * s), color(TINTA)]);
  n.onUpdate(() => { n.pos.y = n.baseY + Math.sin(time() * 4 + n.fase) * 5; });
}

function desenharCarro(o, w, h) {
  const sx = w / 220, sy = h / 90, s = Math.min(sx, sy);
  const B = (bw, bh, x, y, cor, raio, borda = 4) =>
    o.add([rect(bw * sx, bh * sy, { radius: raio * s }), pos(x * sx, y * sy), color(cor), outline(borda * s, TINTA)]);
  B(150, 38, 66, 0, rgb(50, 48, 70), 8);                 // caixas de som (onde se sobe)
  for (const cx of [100, 142]) {
    o.add([circle(15 * s), pos(cx * sx, 19 * sy), color(105, 100, 130), outline(3 * s, TINTA)]);
    const cone = o.add([circle(7 * s), pos(cx * sx, 19 * sy), color(30, 28, 45), scale(1)]);
    cone.onUpdate(() => {
      const batida = Math.abs(Math.sin(time() * 9));
      cone.scale = vec2(1 + batida * 0.35);
      cone.color = batida > 0.6 ? COR.amarelo : rgb(30, 28, 45);
    });
  }
  for (const ty of [11, 27]) o.add([circle(5 * s), pos(186 * sx, ty * sy), color(105, 100, 130), outline(2 * s, TINTA)]);
  B(160, 34, 60, 38, COR.amarelo, 6);                    // carroceria
  B(150, 6, 65, 50, COR.vermelho, 3, 0);
  o.add([escrever("SOM", 20 * s), pos(140 * sx, 62 * sy), anchor("center"), color(255, 255, 255)]);
  B(64, 60, 0, 22, COR.laranja, 12);                     // cabine (frente para a esquerda)
  B(36, 24, 8, 30, rgb(170, 230, 255), 6, 3);            // janela
  o.add([rect(6 * sx, 12 * sy, { radius: 3 * s }), pos(14 * sx, 33 * sy), color(255, 255, 255), opacity(0.6)]);
  o.add([circle(5 * s), pos(5 * sx, 66 * sy), color(255, 240, 150), outline(2 * s, TINTA)]); // farol
  for (const rx of [40, 180]) {
    o.add([circle(16 * s), pos(rx * sx, h), color(35, 32, 45), outline(3 * s, TINTA)]);
    o.add([circle(7 * s), pos(rx * sx, h), color(200, 200, 215)]);
  }
  nota(o, 95 * sx, -18 * sy, s);
  nota(o, 150 * sx, -30 * sy, s);
}

// Coca no jogo: garrafa (proporção da imagem 141 x 538) ou a lata desenhada
const COCA = IMAGENS.coca.url ? { w: 20, h: 76 } : { w: 26, h: 50 };
function iconeCoca(pai, w, h) {
  if (IMAGENS.coca.url) pai.add([sprite("coca", { width: w, height: h })]);
  else desenharCoca(pai, w, h);
}

const DESENHOS = { coca: desenharCoca, remedio: desenharRemedio, halter: desenharHalter, carro_som: desenharCarro };

// Cria um objeto com SPRITE (se tiver url) ou o desenho cartoon
function criarObj(chave, w, h, x, y, extras = []) {
  const obj = add([pos(x, y), ...extras]);
  if (IMAGENS[chave].url) obj.add([sprite(chave, { width: w, height: h })]);
  else DESENHOS[chave](obj, w, h);
  return obj;
}

// Texto que "estoura" e sobe (efeito de "+10")
function balao(msg, p, cor = [255, 255, 255]) {
  const b = add([
    escrever(msg, 26),
    pos(p),
    anchor("center"),
    color(...cor),
    scale(0.3),
    opacity(1),
    move(UP, 80),
    lifespan(0.9, { fade: 0.4 }),
    z(50),
  ]);
  b.onUpdate(() => { b.scale = vec2(Math.min(1, b.scale.x + dt() * 6)); });
}

// ---------------------------------------------------------------------
//  Cenário: céu, sol, nuvens, morros e estrada. velocidade() comanda o movimento.
// ---------------------------------------------------------------------
function nuvem(x, y, s, fator) {
  const n = add([pos(x, y), z(-80), { fator }, "nuvem"]);
  const bolas = [[0, 6, 20], [26, -6, 28], [56, 4, 22], [28, 12, 22]];
  for (const [bx, by, r] of bolas) n.add([circle((r + 4) * s), pos(bx * s, by * s), color(TINTA)]);
  for (const [bx, by, r] of bolas) n.add([circle(r * s), pos(bx * s, by * s), color(255, 255, 255)]);
  n.add([circle(9 * s), pos(16 * s, -8 * s), color(255, 255, 255)]);
  return n;
}

function morro(x, r, cor, zz, fator) {
  const m = add([pos(x, CHAO_Y + r * 0.45), z(zz), { fator, r }, "morro"]);
  m.add([circle(r + 4), color(TINTA)]);
  m.add([circle(r), color(cor)]);
  m.add([circle(r * 0.18), pos(-r * 0.35, -r * 0.55), color(255, 255, 255), opacity(0.2)]);
  return m;
}

function montarCenario(velocidade) {
  // céu em degradê
  add([z(-100), { draw() {
    drawRect({ width: width(), height: CHAO_Y, gradient: [COR.ceuTopo, COR.ceuBase] });
  } }]);

  // sol sorridente com raios girando
  const sol = add([pos(860, 86), z(-90)]);
  const raios = sol.add([rotate(0)]);
  for (let i = 0; i < 10; i++) {
    raios.add([rect(14, 26, { radius: 7 }), anchor("center"), rotate(i * 36), pos(Vec2.fromAngle(i * 36 - 90).scale(62)), color(255, 200, 40), outline(3, TINTA)]);
  }
  raios.onUpdate(() => { raios.angle += 20 * dt(); });
  sol.add([circle(44), color(255, 225, 70), outline(4, TINTA)]);
  sol.add([circle(5), pos(-14, -8), color(TINTA)]);
  sol.add([circle(5), pos(14, -8), color(TINTA)]);
  sol.add([rect(26, 9, { radius: 5 }), pos(0, 14), anchor("center"), color(TINTA)]);
  sol.add([circle(7), pos(-26, 8), color(255, 150, 120), opacity(0.7)]);
  sol.add([circle(7), pos(26, 8), color(255, 150, 120), opacity(0.7)]);

  for (let i = 0; i < 5; i++) nuvem(rand(0, width()), rand(40, 190), rand(0.7, 1.15), rand(0.06, 0.18));
  onUpdate("nuvem", (n) => {
    n.move(-velocidade() * n.fator - 12, 0);
    if (n.pos.x < -120) n.pos.x = width() + rand(20, 200);
  });

  for (let i = 0; i < 5; i++) morro(i * 260 + rand(-40, 40), rand(150, 210), COR.morroLonge, -60, 0.15);
  for (let i = 0; i < 4; i++) morro(i * 320 + 120 + rand(-40, 40), rand(100, 140), COR.morroPerto, -55, 0.3);
  onUpdate("morro", (m) => {
    m.move(-velocidade() * m.fator, 0);
    if (m.pos.x < -m.r - 10) m.pos.x += 1300 + rand(0, 100);
  });

  // estrada
  add([rect(width(), height() - CHAO_Y), pos(0, CHAO_Y), color(COR.asfalto), z(-10)]);
  add([rect(width(), 4), pos(0, CHAO_Y - 2), color(TINTA), z(-8)]);
  const N_GUIAS = Math.ceil(width() / 40) + 2;
  for (let i = 0; i < N_GUIAS; i++) {
    add([rect(40, 12), pos(i * 40, CHAO_Y + 2), color(i % 2 ? rgb(255, 255, 255) : COR.vermelho), z(-9), "guia"]);
  }
  add([rect(width(), 3), pos(0, CHAO_Y + 14), color(TINTA), z(-8)]);
  onUpdate("guia", (g) => {
    g.move(-velocidade(), 0);
    if (g.pos.x < -40) g.pos.x += 40 * N_GUIAS;
  });
  const N_FAIXAS = Math.ceil(width() / 120) + 1;
  for (let i = 0; i < N_FAIXAS; i++) {
    add([rect(56, 8, { radius: 4 }), pos(i * 120, CHAO_Y + 44), color(COR.amarelo), outline(2, TINTA), z(-9), "faixa"]);
  }
  onUpdate("faixa", (f) => {
    f.move(-velocidade(), 0);
    if (f.pos.x < -60) f.pos.x += 120 * N_FAIXAS;
  });

  onUpdate("raio", (r) => { r.angle += VEL_ATUAL * dt() * 2.2; });
}

scene("jogo", () => {
  setGravity(GRAVIDADE);

  let velocidade = VEL_INICIAL;
  let distancia = 0;
  let bonus = 0;
  let cocas = 0;
  let tempo = 0;
  let vivo = true;
  let carroNaPista = null;
  let teto = null;
  let showAte = 0;
  let cocasNoAr = 0;
  let peAnterior = CHAO_Y;
  let folga = FOLGA_MAXIMA;
  let faltaParaArrancada = 8;
  const pontos = () => Math.floor(distancia / 50) + bonus;

  montarCenario(() => velocidade);

  // Chão (sólido, invisível: a estrada já está desenhada)
  add([rect(width(), height() - CHAO_Y), pos(0, CHAO_Y), opacity(0), area(), body({ isStatic: true }), "chao"]);

  // ---------- O Galego ----------
  const galego = add([
    pos(GALEGO_X, CHAO_Y - P_H),
    // hitbox: da cintura até as rodas, na largura da moto (sem a fumaça). Sem foto, o kart.
    area({ shape: IMAGENS.piloto.url ? new Rect(vec2(-8, 20), 88, P_H - 20) : new Rect(vec2(8, 4), P_W - 16, P_H - 4) }),
    body({ jumpForce: FORCA_PULO, stickToPlatform: false }),
    z(10),
    "player",
  ]);
  const corpo = montarGalego(galego);

  const alturaHerculano = 112;
  const herculano = add([pos(GALEGO_X - folga, CHAO_Y - alturaHerculano), z(9)]);
  const figuraHerculano = herculano.add([pos(0, 0), rotate(0)]);
  desenharHerculano(figuraHerculano, 48, alturaHerculano);
  const nomeHerculano = herculano.add([
    escrever("HERCULANO", 16), pos(28, -16), anchor("center"), color(COR.amarelo),
  ]);

  // ---------- Pulo fluido (buffer + coyote time + altura variável) ----------
  let pediuPuloEm = -10;
  let noChaoEm = -10;

  function pedirPulo() { pediuPuloEm = time(); }
  function soltarPulo() {
    if (galego.vel && galego.vel.y < 0) galego.vel.y *= CORTE_PULO;
  }
  for (const k of ["space", "up", "w"]) {
    onKeyPress(k, pedirPulo);
    onKeyRelease(k, soltarPulo);
  }
  onMousePress(pedirPulo);      // clique e toque no celular
  onMouseRelease(soltarPulo);

  galego.onUpdate(() => {
    if (!vivo) return;
    const pe = galego.pos.y + P_H;
    const sobreCarro = carroNaPista && galego.pos.x + P_W > carroNaPista.pos.x + 66
      && galego.pos.x + 8 < carroNaPista.pos.x + 216;
    // O teto só é sólido quando as rodas chegam por cima.
    if (!teto && sobreCarro && peAnterior <= carroNaPista.pos.y && pe >= carroNaPista.pos.y && galego.vel.y >= 0) {
      teto = carroNaPista;
      pousarNoCarro(teto);
    }
    if (teto && !sobreCarro) teto = null;
    if (teto) {
      galego.pos.y = teto.pos.y - P_H;
      galego.vel.y = 0;
    }
    peAnterior = galego.pos.y + P_H;
    const noChao = teto || galego.isGrounded();
    if (noChao) noChaoEm = time();

    // pula se apertou há pouco (buffer) e estava no chão há pouco (coyote)
    if (time() - pediuPuloEm < 0.12 && time() - noChaoEm < 0.1) {
      galego.jump(FORCA_PULO);
      teto = null;
      cocasNoAr = 0;
      pediuPuloEm = -10;
      noChaoEm = -10;
    }

    // Animação: tremidinha do kart no chão, inclinação no ar
    if (noChao) {
      corpo.pos.y = Math.sin(time() * 30) * 1.5;
      corpo.angle = 0;
    } else {
      corpo.pos.y = 0;
      const vy = galego.vel ? galego.vel.y : 0;
      corpo.angle = Math.max(-15, Math.min(15, vy * 0.02));
    }
  });

  // Fumacinha do escapamento
  loop(0.09, () => {
    if (!vivo || !galego.isGrounded()) return;
    add([
      circle(rand(5, 9)),
      pos(IMAGENS.piloto.url ? galego.pos.add(-14, 52 + rand(-3, 3)) : galego.pos.add(-2, P_H - 24 + rand(-3, 3))),
      color(240, 240, 250), outline(2, TINTA), opacity(0.9),
      move(LEFT, velocidade * 0.35 + 60), lifespan(0.35, { fade: 0.25 }), z(5),
    ]);
  });

  // ---------- Movimento de tudo que vem da direita ----------
  onUpdate("scroll", (o) => {
    if (!vivo || (o === carroNaPista && tempo < showAte)) return;
    o.move(-velocidade, 0);
    if (o.pos.x < -400) {
      if (o === carroNaPista) carroNaPista = null;
      destroy(o);
    }
  });
  onUpdate("coca", (c) => {
    c.pos.y = c.baseY + Math.sin(time() * 6 + c.fase) * 4; // flutuando
    c.angle = Math.sin(time() * 4 + c.fase) * 8;
  });

  // ---------- Spawners ----------
  // x, y: canto de uma lata de 26 x 50; a garrafa fica centrada nela, com a mesma base
  function spawnCoca(x, y) {
    const cx = x + 13 - COCA.w / 2, cy = y + 50 - COCA.h;
    return criarObj("coca", COCA.w, COCA.h, cx, cy, [
      area({ shape: new Rect(vec2(0, 0), COCA.w, COCA.h) }), rotate(0),
      "scroll", "coca", { baseY: cy, fase: rand(0, 6) },
    ]);
  }

  function spawnCocas(altura = choose([0, 0, 90, 150])) {
    const n = randi(2, 6);
    const y = CHAO_Y - 60 - altura;
    for (let i = 0; i < n; i++) spawnCoca(width() + 20 + i * 55, y);
    return n * 55;
  }

  function spawnObstaculo() {
    const tipo = choose(["remedio", "halter"]);
    const [w, h] = tipo === "remedio" ? [50, 44] : [70, 36];
    const x = width() + 20;
    // Depois de 25s às vezes vem remédio empilhado (caixa dupla)
    const empilhado = tipo === "remedio" && tempo > 25 && rand() < 0.3;
    const hh = empilhado ? h * 2 : h;
    criarObj(tipo, w, hh, x, CHAO_Y - hh, [
      area({ shape: new Rect(vec2(w * 0.12, hh * 0.15), w * 0.76, hh * 0.85) }),
      "scroll", "perigo", { tipo },
    ]);
    // às vezes uma Coca de recompensa em cima do obstáculo
    if (rand() < 0.4) spawnCoca(x + w / 2 - 13, CHAO_Y - hh - 110);
    return w;
  }

  function spawnCarro() {
    const w = 220, h = 90;
    const x = width() + 20;
    carroNaPista = criarObj("carro_som", w, h, x, CHAO_Y - h, ["scroll", z(2), { subiu: false }]);
    spawnCoca(x + 110, CHAO_Y - h - 80);
    spawnCoca(x + 280, CHAO_Y - 60);
    spawnCoca(x + 335, CHAO_Y - 60);
    return w;
  }

  let apresentouCarro = false;
  let distanciaDoSpawn = 0.8 * VEL_INICIAL;
  function proximoSpawn() {
    let largura;
    const r = rand();
    if (tempo < 2) largura = spawnCocas(0);
    else if (!carroNaPista && (!apresentouCarro || r < 0.34)) {
      apresentouCarro = true;
      largura = spawnCarro();
    } else if (r < 0.62) largura = spawnObstaculo();
    else largura = spawnCocas();
    distanciaDoSpawn = distancia + largura + rand(410, 650);
  }

  // ---------- Colisões ----------
  // Cocas em sequência: só a primeira ganha frase; as outras viram "+10" empilhado
  let ultimaCocaEm = -10, sequencia = 0;
  galego.onCollide("coca", (c) => {
    if (!vivo) return;
    sequencia = time() - ultimaCocaEm < 0.6 ? sequencia + 1 : 0;
    ultimaCocaEm = time();
    if (sequencia === 0) balao(choose(FRASES_COCA), c.pos.add(COCA.w / 2, -10), [255, 230, 80]);
    else balao("+10", c.pos.add(COCA.w / 2, -10 - sequencia * 32), [255, 230, 80]);
    destroy(c);
    cocas++;
    if (!teto && !galego.isGrounded()) cocasNoAr++;
    bonus += 10;
    velocidade = Math.min(VEL_MAX, velocidade + BOOST_COCA);
    folga = Math.min(FOLGA_MAXIMA, folga + FOLGA_POR_COCA);
  });

  galego.onCollide("perigo", (p) => fimDeJogo(p.tipo));

  galego.onGround(() => { cocasNoAr = 0; });

  let primeiraCocaDaOnda = null;
  function pousarNoCarro(carro) {
    const combo = cocasNoAr * 10;
    cocasNoAr = 0;
    const ponto = galego.pos.add(P_W / 2, -75);
    if (combo) {
      bonus += combo;
      balao(`COMBO x2! +${combo}`, ponto, [255, 230, 80]);
    }
    if (carro.subiu) return;
    carro.subiu = true;
    bonus += 25;
    showAte = tempo + 8;
    Musica.iniciarRefrao();
    balao("AUMENTA O SOM! +25", ponto.add(0, -35), [255, 170, 40]);

    for (const atraso of [0.8, 4.4]) {
      wait(atraso, () => {
        if (!vivo) return;
        for (const [i, altura] of [126, 158, 158, 126].entries()) {
          const coca = spawnCoca(GALEGO_X + velocidade * (0.95 + i * 0.09), carro.pos.y - altura);
          if (i === 0) primeiraCocaDaOnda = coca;
        }
      });
    }
  }

  // ---------- Placar (HUD) ----------
  const hud = add([pos(14, 14), fixed(), z(100)]);
  hud.add([rect(300, 84, { radius: 22 }), pos(0, 6), color(TINTA)]);
  hud.add([rect(300, 84, { radius: 22 }), color(COR.creme), outline(4, TINTA)]);
  const hudPontos = hud.add([escrever("0", 34), pos(20, 8), color(COR.amarelo)]);
  hud.add([escrever("pts", 20, { liso: true }), pos(222, 22), color(TINTA)]);
  if (IMAGENS.coca.url) iconeCoca(hud.add([pos(23, 48)]), 9, 34);
  else desenharCoca(hud.add([pos(20, 52), scale(0.5)]), 26, 50);
  const hudCocas = hud.add([escrever("x 0", 22, { liso: true }), pos(40, 54), color(TINTA)]);
  hud.add([escrever("VEL", 18, { liso: true }), pos(116, 56), color(TINTA)]);
  hud.add([rect(130, 16, { radius: 8 }), pos(154, 58), color(255, 255, 255), outline(3, TINTA)]);
  const barra = hud.add([rect(10, 10, { radius: 5 }), pos(157, 61), color(COR.laranja)]);
  const hudShow = hud.add([
    escrever("", 23), pos(width() / 2 - 14, 23), anchor("center"), color(COR.amarelo),
  ]);

  onUpdate(() => {
    VEL_ATUAL = velocidade;
    if (!vivo) return;
    tempo += dt();
    velocidade = Math.min(VEL_MAX, velocidade + 6 * dt()); // fica mais difícil com o tempo
    distancia += velocidade * dt();
    const noShow = tempo < showAte;
    if (!noShow) {
      faltaParaArrancada -= dt();
      folga = Math.max(FOLGA_CAPTURA, folga - (7 + 4 * (velocidade - VEL_INICIAL) / (VEL_MAX - VEL_INICIAL)) * dt());
    }
    const avisando = !noShow && faltaParaArrancada <= AVISO_ARRANCADA;
    const arrancando = avisando && faltaParaArrancada <= DURACAO_ARRANCADA;
    const progresso = arrancando ? Math.min(1, 1 - faltaParaArrancada / DURACAO_ARRANCADA) : 0;
    const folgaVisual = folga + (FOLGA_CAPTURA - folga) * progresso;
    herculano.pos.x = GALEGO_X - folgaVisual;
    figuraHerculano.pos.y = -Math.abs(Math.sin(tempo * 16)) * 5;
    figuraHerculano.angle = Math.sin(tempo * 16) * 4;
    nomeHerculano.text = arrancando ? "PULE!" : avisando ? "VAI ARRANCAR!" : folga < 57 ? "PEGUE COCAS!" : "HERCULANO";
    nomeHerculano.color = avisando || folga < 57 ? COR.vermelho : COR.amarelo;
    const tentouPegar = arrancando && faltaParaArrancada <= 0;
    const alcancouNaCorrida = !noShow && !avisando && folga <= FOLGA_CAPTURA;
    if ((tentouPegar || alcancouNaCorrida) && galego.pos.y + P_H >= CHAO_Y - 54) {
      fimDeJogo("herculano");
      return;
    }
    if (tentouPegar) {
      faltaParaArrancada = INTERVALO_ARRANCADA;
      folga = Math.max(80, folga);
    }
    const carroChegando = carroNaPista && !carroNaPista.subiu && carroNaPista.pos.x + 216 > GALEGO_X;
    if (!noShow && !carroChegando && distancia >= distanciaDoSpawn) proximoSpawn();
    const tempoAteCoca = primeiraCocaDaOnda ? (primeiraCocaDaOnda.pos.x - GALEGO_X - P_W) / velocidade : Infinity;
    const horaDePular = tempoAteCoca > 0.04 && tempoAteCoca < 0.24;
    hudShow.text = noShow ? `${horaDePular ? "PULE!" : "CARRO DO SOM"}  ${Math.ceil(showAte - tempo)}s`
      : carroChegando ? "PULE NO CARRO DO SOM" : "";
    if (!noShow) Musica.encerrarRefrao();
    hudPontos.text = String(pontos());
    hudCocas.text  = `x ${cocas}`;
    const t = (velocidade - VEL_INICIAL) / (VEL_MAX - VEL_INICIAL);
    barra.width = 10 + 114 * t;
    Musica.ritmo((noShow ? 154 : 132) + Math.round(t * 36));
    barra.color = t > 0.7 ? COR.vermelho : COR.laranja;
  });

  // ---------- Game Over ----------
  function fimDeJogo(motivo) {
    if (!vivo) return;
    vivo = false;
    Musica.encerrarRefrao();
    Musica.tropeco();
    velocidade = 0;
    shake(14);
    balao("NÃÃÃO!", galego.pos.add(P_W / 2, IMAGENS.piloto.url ? PILOTO.y - 16 : -20), [255, 90, 90]);
    const final = pontos();
    const recorde = Math.max(final, lerRecorde());
    salvarRecorde(recorde);
    wait(0.7, () => go("fim", { motivo, pontos: final, cocas, recorde, novoRecorde: final >= recorde && final > 0 }));
  }
});

// =====================================================================
//  CENA: FIM DE JOGO
// =====================================================================
scene("fim", ({ motivo, pontos, cocas, recorde, novoRecorde }) => {
  VEL_ATUAL = 0;
  Musica.ritmo(120);
  montarCenario(() => 30);
  add([rect(width(), height()), color(20, 10, 40), opacity(0.5), z(50)]);

  const MENSAGENS = {
    remedio: ["O Galego tomou o REMÉDIO...", "Ele fez algo sensato. Inaceitável!"],
    halter:  ["O Galego encostou num HALTER...", "Exercício?! Desmaiou de desgosto!"],
    herculano: ["HERCULANO pegou o Galego!", "Pule no aviso PULE! para escapar da arrancada."],
  };
  const [titulo, sub] = MENSAGENS[motivo] || ["Fim de jogo!", ""];

  // Painel
  const painel = add([pos(width() / 2, 268), anchor("center"), z(60)]);
  painel.add([rect(600, 360, { radius: 30 }), anchor("center"), pos(0, 8), color(TINTA)]);
  painel.add([rect(600, 360, { radius: 30 }), anchor("center"), color(COR.creme), outline(6, TINTA)]);
  painel.add([rect(330, 72, { radius: 36 }), anchor("center"), pos(0, -178), color(COR.vermelho), outline(5, TINTA)]);
  painel.add([escrever("GAME OVER", 48), anchor("center"), pos(0, -176), color(COR.amarelo)]);

  painel.add([escrever(titulo, 28, { liso: true }), anchor("center"), pos(0, -108), color(TINTA)]);
  painel.add([escrever(sub, 20, { liso: true, largura: 520 }), anchor("center"), pos(0, -74), color(200, 70, 40)]);

  // Caixinhas de pontos e cocas
  for (const [x, rotulo, valor, cor] of [[-120, "PONTOS", pontos, COR.azul], [120, "COCAS", cocas, COR.vermelho]]) {
    painel.add([rect(200, 96, { radius: 20 }), anchor("center"), pos(x, 4), color(cor), outline(4, TINTA)]);
    painel.add([escrever(rotulo, 18), anchor("center"), pos(x, -24), color(255, 255, 255)]);
    painel.add([escrever(String(valor), 44), anchor("center"), pos(x, 18), color(COR.amarelo)]);
  }

  const rec = painel.add([
    escrever(novoRecorde ? "NOVO RECORDE!!!" : `Recorde: ${recorde}`, novoRecorde ? 30 : 24, { liso: !novoRecorde }),
    anchor("center"), pos(0, 82), color(novoRecorde ? COR.laranja : TINTA), scale(1),
  ]);
  if (novoRecorde) rec.onUpdate(() => { rec.scale = vec2(1 + Math.sin(time() * 8) * 0.08); });

  // Cabeção tonto no canto do painel
  if (IMAGENS.galego.url) {
    const cab = add([sprite("galego", { width: 96, height: 114 }), pos(212, 132), anchor("center"), rotate(-14), z(70)]);
    cab.onUpdate(() => { cab.angle = -14 + Math.sin(time() * 3) * 6; });
    for (let i = 0; i < 3; i++) {
      const e = add([escrever("*", 34), pos(212, 70), anchor("center"), color(COR.amarelo), z(71)]);
      e.onUpdate(() => {
        const a = time() * 3 + i * 2.1;
        e.pos = vec2(212 + Math.cos(a) * 46, 76 + Math.sin(a) * 12);
      });
    }
  }

  botao("FUGIR DE NOVO!", width() / 2, 410, 320, 60, COR.verde);
  add([
    escrever("ESPAÇO ou toque na tela", 18), pos(width() / 2, 505), anchor("center"), color(255, 255, 255), z(60),
  ]);

  // pequena pausa pra ninguém reiniciar sem querer
  let pode = false;
  wait(0.6, () => { pode = true; });
  const reiniciar = () => { if (pode) go("jogo"); };
  onKeyPress("space", reiniciar);
  onMousePress(reiniciar);
});

go("inicio");
</script>
